<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Warm background circle with hand-drawn doodle border -->
  <circle cx="32" cy="32" r="30" fill="#FAF7EE" stroke="#181818" stroke-width="3" />
  
  <!-- Red/terracotta doodle heart behind letters -->
  <path d="M32 50 C32 50 14 38 14 26 C14 18 20 14 26 16 C29 17 31 20 32 22 C33 20 35 17 38 16 C44 14 50 18 50 26 C50 38 32 50 32 50 Z" 
        fill="#F7DCD7" 
        stroke="#B4533C" 
        stroke-width="2.5" 
        stroke-linejoin="round" />
  
  <!-- Bride & Groom monogram: K & A in hand-drawn style -->
  <text x="32" y="36" 
        font-family="'Delicious Handrawn', cursive, sans-serif" 
        font-size="20" 
        font-weight="900" 
        fill="#181818" 
        text-anchor="middle" 
        dominant-baseline="central">K &amp; A</text>
</svg>
